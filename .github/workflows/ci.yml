name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # torch AND torchaudio must come from the same CPU index: pulling
          # torchaudio from PyPI gets a CUDA build whose native extension then
          # fails to load against CPU torch.
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Test
        run: pytest tests/ -q --timeout=600

  # `import gemma4_pt_claude` must work with only the core dependencies.
  # Guards the class of bug that broke this workflow: a module-level probe of an
  # optional package raising something other than ImportError.
  import-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core only
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - name: Import without optional deps
        run: |
          python -c "
          import gemma4_pt_claude as g4
          import torch
          # The pure-torch paths must work with no optional dependency present.
          g4.extract_mel_spectrogram(torch.randn(16000))
          g4.frame_waveform(torch.randn(16000))
          with torch.device('meta'):
              g4.gemma4_12b()
          print('ok', g4.__version__)
          "

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests
